name: Build

# Every push and pull request builds the .dmg (downloadable from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the .dmg attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/make-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Tinto-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the release was created by hand on GitHub, just attach the .dmg to it.
          # Otherwise (tag pushed from the Terminal), create it with the install notes.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg \
              --title "Tinto $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          fi
