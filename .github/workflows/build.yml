name: Build

# Every push and pull request builds the .dmg (downloadable from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes a GitHub Release with the .dmg attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/make-dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Tinto-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "Tinto $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
